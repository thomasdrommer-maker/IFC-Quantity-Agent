name: MVP-1 tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test object detail presentation
        run: node tests/test_object_details.cjs
      - name: Validate OpenAPI export
        run: |
          python export_openapi.py
          git diff --exit-code -- openapi/ifc_quantity_agent_mvp1_openapi_v1.json


  object-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test dependencies
        run: npm ci --prefix tests/browser
      - name: Install Chromium
        run: node tests/browser/node_modules/playwright/cli.js install --with-deps chromium --only-shell
      - name: Verify independent scroll areas and fixed filters
        run: node tests/test_object_scroll.cjs
